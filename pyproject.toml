[project]
name = "smartordingagent"
version = "0.1.0"
description = "Restaurant ordering and reservation assistant powered by an LLM agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-huggingface>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pymilvus>=3.0.2",
    "pymysql>=1.2.3",
    "redis>=8.1.0",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
